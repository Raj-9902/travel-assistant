<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | Travel Assistant</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }
        body {
            background: url('https://source.unsplash.com/1600x900/?sky,clouds,travel') no-repeat center center/cover;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .forgot-container {
            background: rgba(255, 255, 255, 0.95);
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0px 4px 20px rgba(0, 0, 0, 0.3);
            text-align: center;
            width: 400px;
            transition: transform 0.3s ease-in-out;
        }
        .forgot-container:hover {
            transform: translateY(-5px);
        }
        .forgot-container h2 {
            margin-bottom: 20px;
            color: #333;
            font-size: 24px;
        }
        .input-group {
            position: relative;
            margin-bottom: 20px;
        }
        .input-group input {
            width: 100%;
            padding: 12px;
            padding-left: 45px;
            border: 2px solid #FFA500;
            border-radius: 8px;
            outline: none;
            font-size: 16px;
            transition: all 0.3s ease;
        }
        .input-group input:focus {
            border-color: #FF8C00;
            box-shadow: 0px 0px 8px rgba(255, 140, 0, 0.6);
        }
        .input-group i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #FFA500;
            font-size: 18px;
        }
        .btn {
            width: 100%;
            padding: 12px;
            background: #FFA500;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 18px;
            font-weight: bold;
            transition: background 0.3s ease-in-out;
        }
        .btn:hover {
            background: #FF8C00;
        }
        .back-login {
            display: block;
            margin-top: 12px;
            color: #FFA500;
            text-decoration: none;
            font-size: 16px;
            font-weight: bold;
        }
        .back-login:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="forgot-container">
        <h2>Reset Your Password</h2>
        <p>Please enter your email to receive a password reset link.</p>
        <div class="input-group">
            <i class="fas fa-envelope"></i>
            <input type="email" placeholder="Email Address" required>
        </div>
        <button class="btn">Send Reset Link</button>
        <a href="login.html" class="back-login">Back to Login</a>
    </div>
</body>
</html>
