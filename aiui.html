<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Assistant Chatbot</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }
        body {
            display: flex;
            height: 100vh;
            background: linear-gradient(to right, #007BFF, #00C6FF);
            color: white;
        }
        .sidebar {
            width: 350px;
            background: rgba(0, 0, 0, 0.8);
            padding: 25px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            border-top-right-radius: 20px;
            border-bottom-right-radius: 20px;
            box-shadow: 5px 0 10px rgba(0, 0, 0, 0.3);
        }
        .sidebar h2 {
            text-align: center;
            font-size: 24px;
            margin-bottom: 15px;
        }
        .sidebar label {
            font-size: 16px;
        }
        .sidebar input {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 5px;
            margin-top: 5px;
            font-size: 16px;
        }
        .sidebar button {
            margin-top: 15px;
            padding: 12px;
            border: none;
            background: #00C6FF;
            color: white;
            font-size: 18px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
        }
        .sidebar button:hover {
            background: #007BFF;
        }
        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 30px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            margin: 20px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }
        .chat-box {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            background: white;
            border-radius: 15px;
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.1);
            color: black;
        }
        .input-box {
            display: flex;
            margin-top: 15px;
        }
        .input-box input {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
        }
        .input-box button {
            padding: 12px 18px;
            border: none;
            background: #00C6FF;
            color: white;
            font-size: 18px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
            margin-left: 10px;
        }
        .input-box button:hover {
            background: #007BFF;
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <h2>Find Best Route</h2>
        <label for="source">Source:</label>
        <input type="text" id="source" placeholder="Enter source">
        <label for="destination">Destination:</label>
        <input type="text" id="destination" placeholder="Enter destination">
        <button onclick="findRoute()">Find Route</button>
    </div>
    <div class="chat-container">
        <div class="chat-box" id="chat-box">
            <p><strong>AI:</strong> Hello! How can I assist your travel today?</p>
        </div>
        <div class="input-box">
            <input type="text" id="user-input" placeholder="Type your message...">
            <button onclick="sendMessage()"><i class="fas fa-paper-plane"></i></button>
        </div>
    </div>
    <script>
        function sendMessage() {
            const userInput = document.getElementById("user-input").value;
            if (userInput.trim() === "") return;
            
            const chatBox = document.getElementById("chat-box");
            chatBox.innerHTML += `<p><strong>You:</strong> ${userInput}</p>`;
            document.getElementById("user-input").value = "";
            chatBox.scrollTop = chatBox.scrollHeight;
            
            fetch("http://127.0.0.1:5000/chatbot", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ message: userInput })
            })
            .then(response => response.json())
            .then(data => {
                chatBox.innerHTML += `<p><strong>AI:</strong> ${data.response}</p>`;
                chatBox.scrollTop = chatBox.scrollHeight;
            })
            .catch(error => console.error("Error:", error));
        }
        
        function findRoute() {
            const source = document.getElementById("source").value;
            const destination = document.getElementById("destination").value;
            if (source.trim() === "" || destination.trim() === "") {
                alert("Please enter both source and destination");
                return;
            }
            
            fetch("http://127.0.0.1:5000/find_route", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ source: source, destination: destination })
            })
            .then(response => response.json())
            .then(data => {
                alert(`Best route: ${data.route}`);
            })
            .catch(error => console.error("Error:", error));
        }
    </script>
</body>
</html>
